[project]
name = "ppo-walker2d"
version = "0.1.0"
description = "A reproducible PPO training pipeline for MuJoCo Walker2d."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "gymnasium[mujoco]>=1.0,<2.0",
  "numpy>=2.0,<3.0",
  "torch>=2.5,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]
demo = [
  "gradio>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
